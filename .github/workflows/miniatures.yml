name: Nuvio Legacy + miniatures

# Prend l'APK Android TV officiel de Nuvio Legacy (iqui27/nuvio-native-legacy),
# y ajoute des miniatures locales sur la barre de temps (remplace Seekr, ferme),
# puis publie l'APK dans les Releases de CE depot.
#
# Lancer : onglet Actions -> "Nuvio Legacy + miniatures" -> Run workflow.
# Telecharger sur la TV (Downloader) :
#   https://github.com/<ton-pseudo>/<ce-depot>/releases/latest/download/Nuvio-Legacy-miniatures.apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version officielle a modifier (ex: v2.0.7, ou latest)"
        default: "latest"
  push:
    paths:
      - ".github/workflows/miniatures.yml"
  # Chaque jour : fabrique la version avec miniatures seulement si une
  # nouvelle version officielle est sortie depuis la derniere fabrication.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-24.04
    outputs:
      fabriquer: ${{ steps.c.outputs.fabriquer }}
    env:
      GH_TOKEN: ${{ github.token }}
      AMONT: iqui27/nuvio-native-legacy
    steps:
      - name: Nouvelle version officielle ?
        id: c
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != schedule ]; then
            echo "fabriquer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(gh release view -R "$AMONT" --json tagName -q .tagName)
          if gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep -q "^miniatures-$V-"; then
            echo "Deja fabrique pour $V : rien a faire."
            echo "fabriquer=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version officielle : $V"
            echo "fabriquer=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: verifier
    if: needs.verifier.outputs.fabriquer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AMONT: iqui27/nuvio-native-legacy
    steps:
      - name: Version officielle
        id: v
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version || 'latest' }}"
          if [ "$V" = latest ]; then V=$(gh release view -R "$AMONT" --json tagName -q .tagName); fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "Version officielle : $V"

      - name: Telecharger l'APK officiel
        run: |
          set -euo pipefail
          mkdir -p orig && cd orig
          gh release download "${{ steps.v.outputs.tag }}" -R "$AMONT" -p '*.apk'
          ls -la
          APK=$(ls *.apk | grep -vi debug | head -1 || true)
          [ -n "$APK" ] || APK=$(ls *.apk | head -1)
          [ -n "$APK" ] || { echo "Aucun APK dans cette version"; exit 1; }
          cp "$APK" ../officiel.apk
          echo "APK choisi : $APK"

      - name: Outils (apktool, build-tools)
        run: |
          set -euo pipefail
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PL=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$PL/android.jar" >> "$GITHUB_ENV"
          echo "build-tools: $BT / plateforme: $PL"

      - name: Ecrire les sources
        run: |
          set -euo pipefail
          mkdir -p src/space/nuvio/nativelegacy
          cat > src/space/nuvio/nativelegacy/MiniServidor.java <<'JAVA_FIM'
          package space.nuvio.nativelegacy;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.media.MediaMetadataRetriever;
          import android.os.Build;
          import android.util.Log;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.lang.reflect.Field;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.nio.charset.Charset;
          import java.util.ArrayDeque;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          /**
           * Miniatures locales pour la barre de temps de Nuvio Legacy.
           *
           * libmain.so (officiel) parle a l'API Seekr. Ses adresses "https://api.seekr.tv"
           * ont ete remplacees, a longueur egale, par "http://[::1]:8471/ab". Ce petit
           * serveur, lance au demarrage de l'activite, imite donc Seekr :
           *
           *   GET /ab/v1/keys/validate          -> {"valid":true}
           *   GET /ab/sprites?duration_ms=..    -> {"vtt_url": ".../v/<sess>.vtt?exp=.."}
           *   GET /ab/v/<sess>.vtt              -> WebVTT, une image toutes les N secondes
           *   GET /ab/f/<sess>/<i>.jpg          -> l'image i (320x180), creee a la demande
           *
           * Les images sont extraites du fichier en cours de lecture (NvPlayer.urlAtual)
           * avec MediaMetadataRetriever, en arriere-plan et a basse priorite. Une image
           * demandee pendant l'avance rapide passe devant les autres.
           */
          public final class MiniServidor {
              private static final String TAG = "MiniServidor";
              static final int PORTA = 8471;
              static final String BASE = "http://127.1:" + PORTA + "/ab";
              private static final int LARG = 320, ALT = 180;
              private static final Charset UTF8 = Charset.forName("UTF-8");

              private static volatile boolean iniciado;
              private static final Object trava = new Object();
              private static Sessao atual;
              private static int proximoId = 1;

              private MiniServidor() {}

              /** Chamado no onCreate da NuvioActivity. Idempotente e nunca lanca. */
              public static void iniciar(Context ctx) {
                  if (iniciado) return;
                  iniciado = true;
                  try {
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() { aceitar(); }
                      }, "MiniServidor");
                      t.setDaemon(true);
                      t.start();
                  } catch (Throwable e) {
                      Log.w(TAG, "iniciar: " + e);
                  }
              }

              // ------------------------------------------------------------------ HTTP

              private static void aceitar() {
                  ServerSocket ss = null;
                  // So o loopback: nada fica exposto na rede de casa. A porta pode estar
                  // presa um instante por um processo anterior do app: tenta de novo.
                  for (int tentativa = 0; ss == null; tentativa++) {
                      try {
                          ss = new ServerSocket();
                          ss.setReuseAddress(true);
                          ss.bind(new java.net.InetSocketAddress(InetAddress.getByName("127.0.0.1"), PORTA), 32);
                          Log.i(TAG, "a escuta em 127.0.0.1:" + PORTA);
                      } catch (Throwable e) {
                          if (tentativa % 30 == 0) Log.w(TAG, "bind: " + e);
                          try { if (ss != null) ss.close(); } catch (Throwable ignored) {}
                          ss = null;
                          try { Thread.sleep(2000); } catch (InterruptedException ie) { return; }
                      }
                  }
                  while (true) {
                      try {
                          final Socket s = ss.accept();
                          Thread t = new Thread(new Runnable() {
                              @Override public void run() { atender(s); }
                          }, "MiniServidor-req");
                          t.setDaemon(true);
                          t.start();
                      } catch (Throwable e) {
                          Log.w(TAG, "accept: " + e);
                          try { Thread.sleep(200); } catch (InterruptedException ignored) { return; }
                      }
                  }
              }

              private static String lerLinha(InputStream in) throws java.io.IOException {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  int c;
                  while ((c = in.read()) != -1) {
                      if (c == '\n') break;
                      if (c != '\r') b.write(c);
                      if (b.size() > 16384) break;
                  }
                  if (c == -1 && b.size() == 0) return null;
                  return new String(b.toByteArray(), UTF8);
              }

              private static void atender(Socket s) {
                  try {
                      s.setSoTimeout(20000);
                      InputStream in = new BufferedInputStream(s.getInputStream());
                      String linha = lerLinha(in);
                      if (linha == null) { s.close(); return; }
                      // Cabecalhos: so consumidos.
                      String h;
                      while ((h = lerLinha(in)) != null && h.length() > 0) { /* ignora */ }
                      String[] partes = linha.split(" ");
                      String alvo = partes.length > 1 ? partes[1] : "/";
                      String caminho = alvo, consulta = "";
                      int q = alvo.indexOf('?');
                      if (q >= 0) { caminho = alvo.substring(0, q); consulta = alvo.substring(q + 1); }
                      if (caminho.startsWith("/ab/")) caminho = caminho.substring(3);
                      OutputStream out = s.getOutputStream();
                      try {
                          rotear(caminho, consulta, out);
                      } catch (Throwable e) {
                          Log.w(TAG, "rota " + caminho + ": " + e);
                          responder(out, 404, "application/json", "{\"error\":\"internal\"}".getBytes(UTF8));
                      }
                      out.flush();
                  } catch (Throwable e) {
                      Log.w(TAG, "atender: " + e);
                  } finally {
                      try { s.close(); } catch (Throwable ignored) {}
                  }
              }

              private static void responder(OutputStream out, int st, String tipo, byte[] corpo) throws java.io.IOException {
                  String txt = st == 200 ? "OK" : st == 404 ? "Not Found" : "Error";
                  String cab = "HTTP/1.1 " + st + " " + txt + "\r\n"
                          + "Content-Type: " + tipo + "\r\n"
                          + "Content-Length: " + corpo.length + "\r\n"
                          + "Cache-Control: no-store\r\n"
                          + "Connection: close\r\n\r\n";
                  out.write(cab.getBytes(UTF8));
                  out.write(corpo);
              }

              private static String param(String consulta, String nome) {
                  for (String p : consulta.split("&")) {
                      int i = p.indexOf('=');
                      if (i > 0 && p.substring(0, i).equals(nome)) return p.substring(i + 1);
                  }
                  return null;
              }

              private static long expira() { return System.currentTimeMillis() / 1000L + 86400L; }

              private static void rotear(String caminho, String consulta, OutputStream out) throws java.io.IOException {
                  if (caminho.endsWith("/v1/keys/validate")) {
                      responder(out, 200, "application/json", "{\"valid\":true}".getBytes(UTF8));
                      return;
                  }
                  if (caminho.endsWith("/sprites")) {
                      long dur = 0;
                      try { dur = Long.parseLong(param(consulta, "duration_ms")); } catch (Throwable ignored) {}
                      Sessao se = sessaoPara(dur);
                      if (se == null) {
                          responder(out, 404, "application/json", "{\"error\":\"no preview\"}".getBytes(UTF8));
                          return;
                      }
                      String json = "{\"vtt_url\":\"" + BASE + "/v/" + se.id + ".vtt?exp=" + expira()
                              + "\",\"scale\":1.0,\"source_duration_ms\":" + se.durMs + "}";
                      responder(out, 200, "application/json", json.getBytes(UTF8));
                      return;
                  }
                  if (caminho.startsWith("/v/") && caminho.endsWith(".vtt")) {
                      int id = inteiro(caminho.substring(3, caminho.length() - 4));
                      Sessao se = sessaoId(id);
                      if (se == null) { responder(out, 404, "text/plain", new byte[0]); return; }
                      responder(out, 200, "text/vtt", se.vtt().getBytes(UTF8));
                      return;
                  }
                  if (caminho.startsWith("/f/") && caminho.endsWith(".jpg")) {
                      String[] p = caminho.substring(3, caminho.length() - 4).split("/");
                      Sessao se = p.length == 2 ? sessaoId(inteiro(p[0])) : null;
                      int idx = p.length == 2 ? inteiro(p[1]) : -1;
                      byte[] jpg = se != null ? se.quadro(idx, 9000) : null;
                      if (jpg == null) { responder(out, 404, "text/plain", new byte[0]); return; }
                      responder(out, 200, "image/jpeg", jpg);
                      return;
                  }
                  responder(out, 404, "text/plain", new byte[0]);
              }

              private static int inteiro(String s) {
                  try { return Integer.parseInt(s); } catch (Throwable e) { return -1; }
              }

              // --------------------------------------------------------------- sessoes

              private static String campo(String nome) {
                  try {
                      Class<?> c = Class.forName("space.nuvio.nativelegacy.NvPlayer");
                      Field f = c.getDeclaredField(nome);
                      f.setAccessible(true);
                      Object v = f.get(null);
                      return v instanceof String ? (String) v : "";
                  } catch (Throwable e) {
                      Log.w(TAG, "campo " + nome + ": " + e);
                      return "";
                  }
              }

              private static Sessao sessaoPara(long durMs) {
                  String url = campo("urlAtual");
                  String cab = campo("cabAtual");
                  if (durMs <= 0 || url.length() == 0) return null;
                  String baixo = url.toLowerCase(Locale.ROOT);
                  if (!(baixo.startsWith("http://") || baixo.startsWith("https://"))) return null;
                  // HLS/DASH: o MediaMetadataRetriever nao le playlists.
                  if (baixo.contains(".m3u8") || baixo.contains(".mpd")) return null;
                  synchronized (trava) {
                      // Mesma midia (o C renova o pedido a cada poucas horas): mesma sessao.
                      if (atual != null && !atual.morta && atual.url.equals(url)
                              && Math.abs(atual.durMs - durMs) < 3000) return atual;
                      if (atual != null) atual.encerrar();
                      atual = new Sessao(proximoId++, url, cab, durMs);
                      atual.comecar();
                      return atual;
                  }
              }

              private static Sessao sessaoId(int id) {
                  synchronized (trava) {
                      return atual != null && atual.id == id && !atual.morta ? atual : null;
                  }
              }

              static final class Sessao {
                  final int id;
                  final String url;
                  final Map<String, String> cab = new HashMap<String, String>();
                  final long durMs;
                  final long passoMs;
                  final int n;
                  final byte[][] quadros;
                  final boolean[] falhou;
                  final ArrayDeque<Integer> urgentes = new ArrayDeque<Integer>();
                  final long criadaEm = System.currentTimeMillis();
                  volatile boolean morta;
                  volatile boolean quebrada;   // a fonte nao abre: tudo 404 na hora
                  int fundo;                    // cursor da ordem de fundo
                  int[] ordem;

                  Sessao(int id, String url, String cabecalhos, long durMs) {
                      this.id = id;
                      this.url = url;
                      this.durMs = durMs;
                      for (String linha : cabecalhos.split("\n")) {
                          int i = linha.indexOf(':');
                          if (i <= 0) continue;
                          String k = linha.substring(0, i).trim(), v = linha.substring(i + 1).trim();
                          if (k.length() > 0) cab.put(k, v);
                      }
                      // Uma imagem a cada 10 s (a grade que a tela do Seekr descreve),
                      // no maximo ~1500 imagens para titulos muito longos.
                      long p = 10000L;
                      while (durMs / p > 1500) p += 10000L;
                      passoMs = p;
                      n = (int) Math.max(1, (durMs + p - 1) / p);
                      quadros = new byte[n][];
                      falhou = new boolean[n];
                      ordem = ordemDeFundo(n);
                  }

                  /** Primeiro uma imagem por minuto, depois cada vez mais denso. */
                  private static int[] ordemDeFundo(int n) {
                      int[] r = new int[n];
                      boolean[] ja = new boolean[n];
                      int k = 0;
                      for (int passo : new int[] {6, 3, 1}) {
                          for (int i = 0; i < n; i += passo) {
                              if (!ja[i]) { ja[i] = true; r[k++] = i; }
                          }
                      }
                      return r;
                  }

                  String vtt() {
                      StringBuilder b = new StringBuilder("WEBVTT\n\n");
                      long exp = expira();
                      for (int i = 0; i < n; i++) {
                          long ini = i * passoMs, fim = Math.min(durMs, (i + 1) * passoMs);
                          if (fim <= ini) fim = ini + 1;
                          b.append(tempo(ini)).append(" --> ").append(tempo(fim)).append('\n');
                          b.append(BASE).append("/f/").append(id).append('/').append(i)
                           .append(".jpg?exp=").append(exp)
                           .append("#xywh=0,0,").append(LARG).append(',').append(ALT).append("\n\n");
                      }
                      return b.toString();
                  }

                  private static String tempo(long ms) {
                      long h = ms / 3600000L, m = (ms / 60000L) % 60, s = (ms / 1000L) % 60, r = ms % 1000;
                      return String.format(Locale.ROOT, "%02d:%02d:%02d.%03d", h, m, s, r);
                  }

                  void comecar() {
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() { trabalhar(); }
                      }, "MiniServidor-quadros-" + id);
                      t.setDaemon(true);
                      t.setPriority(Thread.MIN_PRIORITY);
                      t.start();
                  }

                  void encerrar() {
                      synchronized (this) { morta = true; notifyAll(); }
                  }

                  /** Bloqueia ate a imagem existir (ou o prazo acabar). */
                  byte[] quadro(int idx, long prazoMs) {
                      if (idx < 0 || idx >= n) return null;
                      long fim = System.currentTimeMillis() + prazoMs;
                      synchronized (this) {
                          if (quadros[idx] == null && !falhou[idx] && !quebrada) {
                              // A mais recente na frente (a pessoa ainda esta procurando);
                              // as vizinhas (fita anterior/seguinte) logo atras.
                              urgentes.remove(idx);
                              urgentes.addFirst(idx);
                              if (idx + 1 < n) urgentes.addLast(idx + 1);
                              if (idx > 0) urgentes.addLast(idx - 1);
                              notifyAll();
                          }
                          while (quadros[idx] == null && !falhou[idx] && !quebrada && !morta) {
                              long falta = fim - System.currentTimeMillis();
                              if (falta <= 0) break;
                              try { wait(falta); } catch (InterruptedException e) { break; }
                          }
                          return quadros[idx];
                      }
                  }

                  private int proximo() {
                      synchronized (this) {
                          while (!urgentes.isEmpty()) {
                              int i = urgentes.pollFirst();
                              if (quadros[i] == null && !falhou[i]) return i;
                          }
                          // Fundo: espera um pouco depois do inicio e entre imagens, para
                          // nao disputar CPU/rede com a reproducao.
                          long desde = System.currentTimeMillis() - criadaEm;
                          if (desde < 15000) {
                              try { wait(15000 - desde); } catch (InterruptedException e) { return -2; }
                              return -1;
                          }
                          while (fundo < ordem.length) {
                              int i = ordem[fundo];
                              if (quadros[i] == null && !falhou[i]) return -3 - i; // fundo
                              fundo++;
                          }
                          try { wait(2000); } catch (InterruptedException e) { return -2; }
                          return -1;
                      }
                  }

                  private void trabalhar() {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_LOWEST);
                      MediaMetadataRetriever mmr = null;
                      try {
                          mmr = new MediaMetadataRetriever();
                          mmr.setDataSource(url, cab);
                      } catch (Throwable e) {
                          Log.w(TAG, "fonte nao abriu: " + e);
                          synchronized (this) { quebrada = true; notifyAll(); }
                          soltar(mmr);
                          return;
                      }
                      Log.i(TAG, "sessao " + id + ": " + n + " quadros, passo " + passoMs + " ms");
                      int seguidasRuins = 0;
                      long conferidoEm = 0;
                      while (!morta) {
                          // Outro video (ou o player parou): esta sessao acabou.
                          long agora = System.currentTimeMillis();
                          if (agora - conferidoEm > 5000) {
                              conferidoEm = agora;
                              if (!url.equals(campo("urlAtual"))) { encerrar(); break; }
                          }
                          int i = proximo();
                          if (i == -2) break;
                          if (i == -1) continue;
                          boolean deFundo = i <= -3;
                          if (deFundo) {
                              i = -3 - i;
                              // Pausa entre imagens de fundo; uma urgente a interrompe.
                              synchronized (this) {
                                  try { wait(700); } catch (InterruptedException e) { break; }
                                  if (!urgentes.isEmpty() || morta) continue;
                              }
                          }
                          byte[] jpg = null;
                          try {
                              jpg = extrair(mmr, i * passoMs * 1000L);
                          } catch (Throwable e) {
                              Log.w(TAG, "quadro " + i + ": " + e);
                          }
                          synchronized (this) {
                              if (jpg != null) { quadros[i] = jpg; seguidasRuins = 0; }
                              else { falhou[i] = true; seguidasRuins++; }
                              if (seguidasRuins >= 8) quebrada = true;  // decoder nao serve
                              notifyAll();
                          }
                          if (quebrada) break;
                      }
                      soltar(mmr);
                  }

                  private static void soltar(MediaMetadataRetriever mmr) {
                      if (mmr == null) return;
                      try { mmr.release(); } catch (Throwable ignored) {}
                  }

                  private static byte[] extrair(MediaMetadataRetriever mmr, long us) {
                      Bitmap b;
                      if (Build.VERSION.SDK_INT >= 27)
                          b = mmr.getScaledFrameAtTime(us, MediaMetadataRetriever.OPTION_CLOSEST_SYNC, LARG, ALT);
                      else
                          b = mmr.getFrameAtTime(us, MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                      if (b == null) return null;
                      Bitmap out = Bitmap.createBitmap(LARG, ALT, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(out);
                      c.drawColor(Color.BLACK);
                      float esc = Math.min(LARG / (float) b.getWidth(), ALT / (float) b.getHeight());
                      int w = Math.max(1, Math.round(b.getWidth() * esc));
                      int h = Math.max(1, Math.round(b.getHeight() * esc));
                      int x = (LARG - w) / 2, y = (ALT - h) / 2;
                      Paint p = new Paint(Paint.FILTER_BITMAP_FLAG);
                      c.drawBitmap(b, null, new Rect(x, y, x + w, y + h), p);
                      b.recycle();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream(16384);
                      out.compress(Bitmap.CompressFormat.JPEG, 75, bo);
                      out.recycle();
                      return bo.toByteArray();
                  }
              }
          }

          JAVA_FIM
          cat > patch_libmain.py <<'PY_FIM'
          import pathlib, sys
          ANTES = b"https://api.seekr.tv"
          DEPOIS = b"http://127.1:8471/ab"
          assert len(ANTES) == len(DEPOIS)
          raiz = pathlib.Path(sys.argv[1])
          libs = sorted(raiz.glob("lib/*/libmain.so"))
          if not libs:
              sys.exit("ERRO: nenhum lib/*/libmain.so encontrado")
          for so in libs:
              dados = so.read_bytes()
              n = dados.count(ANTES)
              if n == 0 and dados.count(DEPOIS):
                  print(f"{so}: ja corrigido"); continue
              if n == 0:
                  sys.exit(f"ERRO: {so} nao contem {ANTES!r} (versao sem Seekr?)")
              so.write_bytes(dados.replace(ANTES, DEPOIS))
              print(f"{so}: {n} endereco(s) Seekr redirecionado(s)")

          PY_FIM
          cat > hook_smali.py <<'PY_FIM'
          import pathlib, re, sys
          raiz = pathlib.Path(sys.argv[1])
          alvos = list(raiz.glob("smali*/space/nuvio/nativelegacy/NuvioActivity.smali"))
          if len(alvos) != 1:
              sys.exit(f"ERRO: NuvioActivity.smali encontrado {len(alvos)} vez(es)")
          arq = alvos[0]
          txt = arq.read_text(encoding="utf-8")
          CHAMADA = "    invoke-static {p0}, Lspace/nuvio/nativelegacy/MiniServidor;->iniciar(Landroid/content/Context;)V\n"
          if "MiniServidor;->iniciar" in txt:
              print("hook ja presente"); sys.exit(0)
          m = re.search(r"^\.method [^\n]*onCreate\(Landroid/os/Bundle;\)V\n(.*?)^\.end method", txt, re.S | re.M)
          if not m:
              sys.exit("ERRO: onCreate(Bundle) nao encontrado")
          corpo = m.group(1)
          sup = re.compile(r"^(\s*invoke-super(?:/range)? \{[^}]*\}, L[^;]+;->onCreate\(Landroid/os/Bundle;\)V\n)", re.M)
          novo, n = sup.subn(lambda x: x.group(1) + "\n" + CHAMADA, corpo)
          if n == 0:
              sys.exit("ERRO: super.onCreate nao encontrado em onCreate")
          txt = txt[:m.start(1)] + novo + txt[m.end(1):]
          arq.write_text(txt, encoding="utf-8")
          print(f"{arq}: MiniServidor.iniciar inserido apos {n} super.onCreate")

          PY_FIM

      # Cle de signature : creee ici la premiere fois, jamais publiee. Elle est
      # gardee dans le cache prive des Actions pour que les mises a jour
      # s'installent par-dessus (meme signature).
      - name: Recuperer la cle de signature
        uses: actions/cache/restore@v4
        with:
          path: cle
          key: cle-signature-v1

      - name: Creer la cle si besoin
        run: |
          set -euo pipefail
          mkdir -p cle
          if [ ! -f cle/cle.p12 ]; then
            PASSE=$(openssl rand -hex 24)
            echo "$PASSE" > cle/passe.txt
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore cle/cle.p12 \
              -storepass "$PASSE" -keypass "$PASSE" -alias nocturne -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Nuvio Legacy Miniatures, C=FR"
            echo "NOUVELLE_CLE=1" >> "$GITHUB_ENV"
          fi

      - name: Sauver la cle
        if: env.NOUVELLE_CLE == '1'
        uses: actions/cache/save@v4
        with:
          path: cle
          key: cle-signature-v1

      - name: Compiler le serveur de miniatures (dex)
        run: |
          set -euo pipefail
          mkdir -p classes dex
          javac -nowarn -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" \
            -d classes src/space/nuvio/nativelegacy/MiniServidor.java
          "$BT/d8" --release --min-api 24 --lib "$ANDROID_JAR" --output dex $(find classes -name '*.class')
          ls -la dex

      - name: Modifier l'APK
        run: |
          set -euo pipefail
          java -jar apktool.jar d -r -f -o app officiel.apk
          python3 patch_libmain.py app
          python3 hook_smali.py app
          java -jar apktool.jar b -o reconstruit.apk app
          # Le serveur entre comme dex supplementaire (classesN.dex suivant).
          N=$(unzip -Z1 reconstruit.apk | grep -cE '^classes[0-9]*\.dex$')
          cp dex/classes.dex "classes$((N + 1)).dex"
          zip -q reconstruit.apk "classes$((N + 1)).dex"
          unzip -Z1 reconstruit.apk | grep -E '^classes[0-9]*\.dex$'

      - name: Aligner et signer
        run: |
          set -euo pipefail
          if "$BT/zipalign" -h 2>&1 | grep -q -- '-P'; then
            "$BT/zipalign" -f -P 16 4 reconstruit.apk aligne.apk
          else
            "$BT/zipalign" -f -p 4 reconstruit.apk aligne.apk
          fi
          export PASSE_CLE="$(cat cle/passe.txt)"
          "$BT/apksigner" sign --ks cle/cle.p12 --ks-pass env:PASSE_CLE --ks-key-alias nocturne \
            --key-pass env:PASSE_CLE --out Nuvio-Legacy-miniatures.apk aligne.apk
          "$BT/apksigner" verify Nuvio-Legacy-miniatures.apk
          ls -la Nuvio-Legacy-miniatures.apk

      - name: Publier dans les Releases de ce depot
        run: |
          set -euo pipefail
          TAG="miniatures-${{ steps.v.outputs.tag }}-${{ github.run_number }}"
          gh release create "$TAG" Nuvio-Legacy-miniatures.apk -R "$GITHUB_REPOSITORY" \
            --title "Nuvio Legacy ${{ steps.v.outputs.tag }} + miniatures (build ${{ github.run_number }})" \
            --notes "APK officiel ${{ steps.v.outputs.tag }} de $AMONT, avec miniatures locales sur la barre de temps. Reglages > Lecture > Seekr : cle 'local', puis activer." \
            --latest
          echo "Lien pour Downloader : https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Nuvio-Legacy-miniatures.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Legacy-miniatures
          path: Nuvio-Legacy-miniatures.apk
